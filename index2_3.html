// ============================================================
// PORTFOLIO — root component
// ============================================================
// Top-level state manager and page router
//
// State managed here:
//   currentPage      — "work" | "about" | "resume" (page router)
//   mouse / mouseRef — cursor position; ref for RAF, state for GlassCursor render
//   loaded           — true after loading screen completes (enables entry animations)
//   showLoading      — true until LoadingScreen fade is done
//   hoveredCard / hoveredCardRef — index of hovered project card (ref for RAF, state for re-render)
//   isHoveringCard/CTA/Tag — cursor state flags for GlassCursor shape changes
//   clickBlobs       — array of {x,y,color,id} for ClickBlob splashes
//
// Refs (direct DOM manipulation, no re-renders):
//   bgBlob0–3        — 4 ambient background gradient blobs
//   bgBlobMouse      — mouse-reactive white highlight blob
//   winSizeRef       — current window dimensions for RAF calculations
//
// Key effects:
//   RAF loop         — updates bg blob positions from mouseRef + hoveredCardRef
//                      using repulse() (blobs flee cursor) + melt() (blobs shift on card hover)
//   onMouseMove      — updates mouseRef (no re-render) + mouse state (GlassCursor only)
//   handleClick      — adds ClickBlob at click position (excluding interactive elements)
function Portfolio() {
  const [currentPage, setCurrentPage] = React.useState("work");

  // mouseRef — updated every frame for RAF, no re-render
  // mouse (state) — only for GlassCursor which needs React to reposition
  const mouseRef = useRef({ x: 0, y: 0 });
  const [mouse, setMouse] = useState({ x:0, y:0 });

  // Loading screen should only play the very first time the portfolio loads in a browser
  // tab/session — not every time someone lands back on index2.html (e.g. clicking
  // "back to portfolio" from a case study page, which is a full page navigation and would
  // otherwise re-mount Portfolio and replay the boot sequence from scratch).
  // sessionStorage persists across full page loads in the same tab but clears when the
  // tab/window closes, so a genuinely new visit still gets the intro.
  let alreadyVisited = false;
  try { alreadyVisited = sessionStorage.getItem("shavanie_portfolio_visited") === "true"; } catch(e) {}

  const [loaded, setLoaded]           = useState(alreadyVisited);
  const [showLoading, setShowLoading]  = useState(!alreadyVisited);
  const [hoveredCard, setHoveredCard]  = useState(null);
  const hoveredCardRef = useRef(null); // ref version for RAF loop (no re-render)
  const [isHoveringCard, setIsHoveringCard] = useState(false);
  const [isHoveringCTA,  setIsHoveringCTA]  = useState(false);
  const [isHoveringTag,  setIsHoveringTag]  = useState(false);
  const [clickBlobs, setClickBlobs]    = useState([]);

  // 4 ambient background blobs + 1 mouse-tracking blob (refs = no re-render on move)
  const bgBlob0 = useRef(null); const bgBlob1 = useRef(null);
  const bgBlob2 = useRef(null); const bgBlob3 = useRef(null);
  const bgBlobMouse = useRef(null);

  const winSizeRef = useRef({ w: window.innerWidth, h: window.innerHeight });
  const [winSize, setWinSize] = useState({ w: window.innerWidth, h: window.innerHeight });
  const isMobile = (typeof window !== 'undefined') && (window.screen.width < 768 || window.innerWidth < 768);

  // window resize handler — updates both ref (for RAF) and state (for mx/my calc)
  useEffect(() => {
    const update = () => {
      winSizeRef.current = { w: window.innerWidth, h: window.innerHeight };
      setWinSize({ w: window.innerWidth, h: window.innerHeight });
    };
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, []);

  // ============================================================
  // BACKGROUND BLOB RAF LOOP
  // Updates bg blob positions directly via refs (zero React re-renders)
  //
  // Two forces act on each blob:
  //   repulse() — blobs float away from cursor (soft spring)
  //   melts     — blobs shift toward corners when a card is hovered
  //               (index maps card 0–3 to quadrant offset presets)
  // ============================================================
  useEffect(() => {
    // melt presets: blob offsets (%) when a specific card is hovered
    // index matches hoveredCardRef — blobs "melt" in different directions per card
    const melts = { 0:{x:-25,y:-20}, 1:{x:25,y:-20}, 2:{x:-25,y:20}, 3:{x:25,y:20} };

    // base center positions of each blob (% of viewport)
    const blobBases = [
      { cx:27.5, cy:17.5 }, // blob 0: top-left
      { cx:70, cy:72.5 },   // blob 1: bottom-right
      { cx:50,   cy:35   }, // blob 2: center-top
      { cx:23, cy:66   },   // blob 3: left-mid
    ];

    // repulse — returns (x,y) offset pushing blob away from cursor
    // strength falls off with distance (cubic falloff, max range = 55% of min viewport dim)
    function repulse(base, mx, my, w, h) {
      const bx = (base.cx/100)*w; const by = (base.cy/100)*h;
      const dx = bx-mx; const dy = by-my;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const maxD = Math.min(w,h)*0.55;
      if (dist>maxD||dist===0) return {x:0,y:0}; // out of range
      const str = 12*Math.pow(1-dist/maxD,1.5); // max 12% push at center
      return {x:(dx/dist)*str, y:(dy/dist)*str};
    }

    let rafId;
    function frame() {
      const { x: mx, y: my } = mouseRef.current;
      const { w, h } = winSizeRef.current;
      const hc = hoveredCardRef.current; // null or 0–3
      const m = hc !== null ? melts[hc] : {x:0,y:0}; // melt offset for hovered card
      const reps = blobBases.map(b => repulse(b, mx, my, w, h));
      // update each blob's position via transform (translate), not left/top — left/top are
      // layout properties, so re-setting them 60x/sec forces the browser to reflow + repaint
      // these large blurred elements every single frame (a real, measurable source of lag on
      // this page). transform is compositor-only: the browser can just re-place the already
      // -painted layer on the GPU, no reflow/repaint needed. Base position stays a static
      // left/top (set once in JSX); only the melt+repulse delta moves via transform here,
      // converted from % of viewport to px since translate() % is relative to the element's
      // OWN size, not the viewport, unlike left/top.
      if (bgBlob0.current) bgBlob0.current.style.transform = `translate(${(m.x*0.8+reps[0].x)/100*w}px, ${(m.y*0.8+reps[0].y)/100*h}px)`;
      if (bgBlob1.current) bgBlob1.current.style.transform = `translate(${(m.x*0.6+reps[1].x)/100*w}px, ${(m.y*0.6+reps[1].y)/100*h}px)`;
      if (bgBlob2.current) bgBlob2.current.style.transform = `translate(${(m.x*1.2+reps[2].x)/100*w}px, ${(m.y*1.2+reps[2].y)/100*h}px)`;
      if (bgBlob3.current) bgBlob3.current.style.transform = `translate(${(m.x*1.0+reps[3].x)/100*w}px, ${(m.y*1.0+reps[3].y)/100*h}px)`;
      // mouse blob tracks cursor directly — also transform-driven now, translated in px from
      // the element's static top-left (0,0) instead of recomputed left/top percentages.
      // "-15%" below matches the old "- 15%" offset (half the blob's own 30% width/height,
      // to center it on the cursor), now expressed in px of the element's own size.
      // half-width/height match the element's own capped size (min(30vw,540px) / min(30vh,300px)
      // in the JSX below) so the blob still centers exactly on the cursor once that cap kicks in
      if (bgBlobMouse.current) { bgBlobMouse.current.style.transform = `translate(${mx - Math.min(w*0.15, 270)}px, ${my - Math.min(h*0.15, 150)}px)`; }
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(rafId);
  }, []);

  // onMouseMove — updates ref immediately (for RAF), sets state only for GlassCursor
  const onMouseMove = useCallback((e) => {
    mouseRef.current = { x: e.clientX, y: e.clientY };
    setMouse({ x: e.clientX, y: e.clientY }); // triggers GlassCursor re-render only
  }, []);

  // handleSetHoveredCard — keeps ref + state in sync for card hover
  const handleSetHoveredCard = useCallback((val) => {
    hoveredCardRef.current = val; // sync ref for RAF loop (no re-render)
    setHoveredCard(val);          // sync state for any future reactive uses
  }, []);

  // handleClick — spawns ClickBlob at cursor position on canvas clicks
  // Skips interactive elements (buttons, links, data-interactive)
  const handleClick = useCallback((e) => {
    if (e.target.closest("button,a,[data-interactive]")) return;
    const color = CLICK_COLORS[Math.floor(Math.random() * CLICK_COLORS.length)];
    const id = Date.now() + Math.random(); // unique id for blob removal
    setClickBlobs(b => [...b, { x: e.clientX, y: e.clientY, color, id }]);
  }, []);

  // removeBlob — called by ClickBlob after its fade-out is complete
  const removeBlob = useCallback((id) => {
    setClickBlobs(b => b.filter(bl => bl.id !== id));
  }, []);

  // normalized mouse position (-0.5 to 0.5) for hero parallax (px, py props)
  const mx = winSize.w > 0 ? mouse.x / winSize.w - 0.5 : 0;
  const my = winSize.h > 0 ? mouse.y / winSize.h - 0.5 : 0;

  return (
    <>
      {/* ============================================================
          GLOBAL STYLES
          - Font imports: Satoshi (sans), Barlow Condensed (display), DM Mono (mono)
          - Reset: box-sizing, scroll-behavior, hidden scrollbar, cursor:none
          - .nav-tab / .nav-sub — hover-reveal sub-label via CSS (not JS)
          - @keyframes: cur (blink), pulse, fadeInLine, drift1–4 (blob CSS anim), iridescentShift
          - .portfolio-card ::after (silver border) / ::before (iridescent border)
            → card-hovered class fades both out (iridescent border handled by JS class toggle)
          ============================================================ */}
      <style>{`
        @import url('https://fonts.cdnfonts.com/css/satoshi');
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap');
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none; }
        html::-webkit-scrollbar { display:none; }
        body { background:#08080c; cursor:none; } /* native cursor hidden — GlassCursor used instead */
        /* nav sub-label: max-height 0 by default, expands to 20px on parent hover */
        .nav-sub { max-height:0 !important; opacity:0 !important; transition: max-height 0.2s ease, opacity 0.2s ease; }
        .nav-tab:hover .nav-sub { max-height:20px !important; opacity:1 !important; }
        .nav-tab:focus-visible .nav-sub { max-height:20px !important; opacity:1 !important; }
        /* keyboard focus ring for the custom role="button"/"link" controls (nav tabs, back
           buttons, carousel dots, story circles, project cards, modal close). cursor:none above
           only hides the mouse pointer — it has no effect on this, so keyboard users always get
           a visible ring here. */
        [role="button"]:focus-visible, [role="link"]:focus-visible, [role="dialog"]:focus-visible {
          outline: 2px solid rgba(255,255,255,0.75);
          outline-offset: 3px;
          border-radius: 2px;
        }
        @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }           /* blinking cursor */
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
        @keyframes fadeInLine { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} } /* loading screen lines */
        /* CSS drift animations for ambient bg blobs (separate from JS RAF repulse) */
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(9%,7%) scale(1.12)} 66%{transform:translate(-7%,10%) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 40%{transform:translate(-10%,-7%) scale(1.1)} 70%{transform:translate(7%,-9%) scale(0.92)} }
        @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 30%{transform:translate(8%,-9%) scale(1.14)} 65%{transform:translate(-9%,7%) scale(0.88)} }
        @keyframes drift4 { 0%,100%{transform:translate(0,0) scale(1)} 45%{transform:translate(-8%,9%) scale(1.11)} 75%{transform:translate(10%,-6%) scale(0.91)} }
        @keyframes iridescentShift { 0%{background-position: 0% 0%;} 100%{background-position: 200% 200%;} } /* card border shimmer */
        /* scroll-peek preview (Card component) — pans the embedded case-study iframe up then
           back down inside a small window while a card is hovered. -420px is in the iframe's
           unscaled coordinate space (see IFRAME_SCALE) — after scaling down to the preview box
           it reads as a natural, subtle amount of movement regardless of iframe content. */
        @keyframes scrollPeek { 0%{ transform:translateY(0); } 100%{ transform:translateY(-420px); } }

        /* VanText ink-bloom blob fill — each .van-blob loops through this grow/fade cycle;
           transform-box:fill-box makes the scale originate from the circle's own center
           rather than the SVG viewport's origin (default for SVG transforms otherwise). */
        .van-blob { animation-timing-function:ease-in-out; animation-iteration-count:infinite; transform-box:fill-box; transform-origin:center; }
        @keyframes blobPulse {
          0%   { transform:scale(0) translateY(6px); opacity:0; }
          18%  { opacity:1; }
          55%  { transform:scale(1) translateY(-2px); opacity:0.92; }
          100% { transform:scale(0.15) translateY(-10px); opacity:0; }
        }

        .portfolio-card { position: relative; }

        /* silver gradient border — default state (::after is lower z-index, always shows) */
        .portfolio-card::after {
          content: ''; position: absolute; inset: 0; border-radius: 0; padding: 1.5px;
          background: linear-gradient(135deg, #b8b8b8 0%, #8e8e8e 30%, #606060 55%, #8e8e8e 75%, #b8b8b8 100%);
          /* mask trick: show only the 1.5px padding ring (excludes content box) */
          -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          mask-composite: exclude; pointer-events: none; z-index: 4; opacity: 0.5; transition: opacity 0.4s ease;
        }

        /* iridescent animated border — fades in on hover (::before, higher z-index) */
        .portfolio-card::before {
          content: ''; position: absolute; inset: 0; border-radius: 0; padding: 1.5px;
          background: linear-gradient(135deg, #f0621a 0%, #e87aa0 25%, #2ab8c4 50%, #1240a0 75%, #f0621a 100%);
          background-size: 200% 200%; animation: iridescentShift 3s linear infinite;
          -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          mask-composite: exclude; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.4s ease;
        }

        /* card-hovered: both borders hidden (blob bg + content takes over visually) */
        .portfolio-card.card-hovered::after  { opacity: 0; }
        .portfolio-card.card-hovered::before { opacity: 0; }

        /* ── print stylesheet ── */
        @media print {
          /* GlassCursor rings/dot, ambient bg blobs, click-blob splashes — all fixed-position,
             pointer-events:none decorative layers with no other purpose on the page */
          *[style*="pointer-events: none"], *[style*="pointer-events:none"] { display: none !important; }
          html, body { background: #fff !important; overflow: visible !important; cursor: auto !important; }
          body * { box-shadow: none !important; text-shadow: none !important; backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important; filter: none !important; animation: none !important;
            transition: none !important; cursor: auto !important; }
          .nav-back, .scroll-progress, .back-to-top { display: none !important; }
        }
      `}</style>

      {/* Loading screen — shown until loaded=true; fades out and unmounts */}
      {showLoading && <LoadingScreen onDone={() => {
        try { sessionStorage.setItem("shavanie_portfolio_visited", "true"); } catch(e) {}
        setLoaded(true);
        setTimeout(() => setShowLoading(false), 700);
      }} />}

      {/* Glass cursor — follows mouse state (re-renders on every mouse move intentionally) */}
      <GlassCursor mouse={mouse} isHoveringCard={isHoveringCard} isHoveringCTA={isHoveringCTA} isHoveringTag={isHoveringTag} />

      {/* Scroll progress bar — right edge, 3px, iridescent gradient */}
      <ScrollProgress />

      {/* Click blobs — rendered at top level so they aren't clipped by section overflow */}
      {clickBlobs.map(b => <ClickBlob key={b.id} {...b} onRemove={removeBlob} />)}

      {/* FIXED BACKGROUND LAYER — 4 color blobs + mouse blob + grain texture */}
      {/* blob positions are driven entirely by the RAF loop via refs (no re-renders).
          Each blob is now an outer position wrapper (ref target — left/top set ONCE as its
          static base position, transform translated by the RAF loop for melt/repulse/cursor
          motion, transition on transform for the spring-in/out ease) around an inner div that
          owns the blur/gradient/opacity AND the CSS drift keyframe animation. Splitting them
          keeps the RAF-driven transform and the CSS-driven drift transform on separate
          elements so they don't fight over the same `transform` property — and moving position
          via transform instead of left/top means the browser can composite these large blurred
          shapes on the GPU without reflowing/repainting them 60x a second. */}
      <div style={{ position:"fixed", inset:0, zIndex:0, pointerEvents:"none", background:DARK }}>
        {/* Each blob's width/height below is capped with CSS min() — e.g. "min(65vw, 1170px)" —
            instead of a bare viewport percentage. A blur filter's cost scales with the number
            of pixels it has to blur, and these blobs were sized as a % of the viewport with NO
            ceiling, so on a big/ultrawide monitor they were being blurred over a dramatically
            larger canvas than on a laptop — while the blur radius (70-80px) stayed fixed, the
            AREA getting blurred kept growing with screen size, which is exactly why this got
            worse the bigger the screen got. The min() caps kick in above roughly a 1800x1000
            viewport, so normal laptop/desktop sizes look completely unchanged; only very large
            screens stop scaling further. */}
        {/* blob 0: orange — top-left */}
        <div ref={bgBlob0} style={{ position:"absolute", width:"min(65vw, 1170px)", height:"min(55vh, 550px)", left:"-5%", top:"-10%", transition:"transform 0.25s ease", willChange:"transform" }}>
          <div style={{ position:"absolute", inset:0, borderRadius:"50%", filter:"blur(70px)", background:"radial-gradient(circle, #f0621a 0%, #d13a0a 50%, transparent 100%)", animation:"drift1 8s ease-in-out infinite", opacity:0.7 }} />
        </div>
        {/* blob 1: blue — bottom-right */}
        <div ref={bgBlob1} style={{ position:"absolute", width:"min(60vw, 1080px)", height:"min(55vh, 550px)", left:"40%", top:"45%", transition:"transform 0.25s ease", willChange:"transform" }}>
          <div style={{ position:"absolute", inset:0, borderRadius:"50%", filter:"blur(75px)", background:"radial-gradient(circle, #1240a0 0%, #0a2878 50%, transparent 100%)", animation:"drift2 11s ease-in-out infinite", opacity:0.65 }} />
        </div>
        {/* blob 2: cyan — center */}
        <div ref={bgBlob2} style={{ position:"absolute", width:"min(40vw, 720px)", height:"min(40vh, 400px)", left:"30%", top:"15%", transition:"transform 0.25s ease", willChange:"transform" }}>
          <div style={{ position:"absolute", inset:0, borderRadius:"50%", filter:"blur(65px)", background:"radial-gradient(circle, #2ab8c4 0%, #0aaabb 50%, transparent 100%)", animation:"drift3 7s ease-in-out infinite", opacity:0.6 }} />
        </div>
        {/* blob 3: pink — left-mid */}
        <div ref={bgBlob3} style={{ position:"absolute", width:"min(36vw, 648px)", height:"min(36vh, 360px)", left:"5%", top:"48%", transition:"transform 0.25s ease", willChange:"transform" }}>
          <div style={{ position:"absolute", inset:0, borderRadius:"50%", filter:"blur(65px)", background:"radial-gradient(circle, #e87aa0 0%, #d45a84 50%, transparent 100%)", animation:"drift4 9s ease-in-out infinite", opacity:0.6 }} />
        </div>
        {/* mouse-reactive soft white highlight — faster transition for responsiveness, no CSS
            drift animation on this one so it doesn't need the wrapper/inner split */}
        <div ref={bgBlobMouse} style={{ position:"absolute", borderRadius:"50%", filter:"blur(80px)", background:"radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%)", width:"min(30vw, 540px)", height:"min(30vh, 300px)", left:0, top:0, transition:"transform 0.1s linear", opacity:0.5, pointerEvents:"none", willChange:"transform" }} />
        {/* SVG grain texture overlay — fractal noise, overlay blend mode */}
        <div style={{ position:"absolute", inset:0, opacity:0.6, backgroundImage:"url(\"data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.45'/%3E%3C/svg%3E\")", backgroundSize:"210px", mixBlendMode:"overlay" }} />
      </div>

      {/* MAIN CONTENT — z-index 1, above fixed bg layer */}
      {/* onMouseMove + onClick handled here so they cover the full page */}
      <div
        style={{ position:"relative", zIndex:1 }}
        onMouseMove={onMouseMove}
        onClick={handleClick}
      >
        {/* WORK PAGE */}
        {currentPage === "work" && <>
          <Hero
            px={mx*30} py={my*30}        // parallax: 30px max offset from center
            loaded={loaded}
            currentPage={currentPage} setCurrentPage={setCurrentPage}
            isMobile={isMobile}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
          />
          <SelectedWork
            isMobile={isMobile}
            onCardHover={handleSetHoveredCard}  // index or null
            onCardEnter={() => setIsHoveringCard(true)}
            onCardLeave={() => setIsHoveringCard(false)}
            onCTAEnter={() => setIsHoveringCTA(true)}
            onCTALeave={() => setIsHoveringCTA(false)}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
          />
          <Footer />
        </>}

        {/* ABOUT PAGE */}
        {currentPage === "about" && (
          <AboutFeed
            currentPage={currentPage} setCurrentPage={setCurrentPage}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
            isMobile={isMobile}
          />
        )}

        {/* RESUME PAGE — placeholder until PDF is ready, same sticky nav as About so there's always a way back */}
        {currentPage === "resume" && (
          <section style={{ display:"flex", flexDirection:"column", alignItems:"center", padding:"0 0 120px", position:"relative" }}>
            {/* STICKY NAV — identical structure to About/Hero nav */}
            <nav style={{ width:"100%", position:"sticky", top:0, zIndex:100, background:"rgba(255,255,255,0.04)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", borderBottom:"1.5px solid rgba(142,142,142,0.22)", marginBottom:48 }}>
              <div style={{ display:"flex", alignItems:"center", padding:"5px 16px", borderBottom:"1px solid rgba(255,255,255,0.06)", fontFamily:"'DM Mono',monospace", fontSize:9, color:"rgba(255,255,255,0.25)", letterSpacing:"0.06em", gap:2 }}>
                <span style={{ color:"rgba(255,255,255,0.5)" }}>~/shavanie</span>
                <span style={{ color:"rgba(255,255,255,0.15)", margin:"0 3px" }}>/</span>
                <span style={{ color:"rgba(255,255,255,0.5)" }}>portfolio</span>
                <span style={{ color:"rgba(255,255,255,0.15)", margin:"0 3px" }}>/</span>
                <span style={{ color:"rgba(167,139,250,0.75)" }}>resume.pdf</span>
              </div>
              <div style={{ display:"flex", alignItems:"stretch", borderBottom:"1px solid rgba(255,255,255,0.07)" }}>
                <div style={{ display:isMobile?"none":"flex", alignItems:"center", gap:5, padding:"10px 20px", borderRight:"1px solid rgba(255,255,255,0.07)", flexShrink:0 }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:"rgba(255,255,255,0.25)" }}>~/</span>
                  <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontSize:17, fontWeight:900, color:"#fff", letterSpacing:"0.12em" }}>SHAVANIE</span>
                </div>
                <div style={{ flex:isMobile?0:1 }} />
                {[
                  { label:"work",   sub:"003 projects",  accent:"#f0621a" },
                  { label:"about",  sub:"yes i'm real",  accent:"#2ab8c4" },
                  { label:"resume", sub:"hire me (pls)", accent:"#a78bfa" },
                ].map(t => {
                  const isActive = currentPage === t.label;
                  return (
                    <div key={t.label} onClick={() => setCurrentPage(t.label)}
                      onKeyDown={onKeyActivate(() => setCurrentPage(t.label))}
                      role="button" tabIndex={0} aria-current={isActive ? "page" : undefined} aria-label={t.label+" — "+t.sub}
                      className="nav-tab"
                      style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:isMobile?"8px 4px":"10px 24px", gap:2, borderLeft:"1px solid rgba(255,255,255,0.07)", cursor:"pointer", position:"relative", flex:isMobile?1:"none", minWidth:isMobile?0:120, transition:"background 0.2s",
                        background: isActive ? t.accent+"18" : "transparent",
                        borderBottom: isActive ? "1.5px solid "+t.accent : "none" }}>
                      <span style={{ fontFamily:"'Barlow Condensed',sans-serif", fontSize:isMobile?13:16, fontWeight:900, color:"#fff", letterSpacing:isMobile?"0.1em":"0.18em", textTransform:"uppercase" }}>{t.label.toUpperCase()}</span>
                      {/* sub-label slides down on hover via .nav-sub CSS class, same as the home nav */}
                      {!isMobile && <span className="nav-sub" style={{ fontFamily:"'DM Mono',monospace", fontSize:11, letterSpacing:"0.08em", textAlign:"center", color:t.accent+"bb", maxHeight:0, overflow:"hidden", transition:"max-height 0.2s ease, opacity 0.2s ease", opacity:0 }}>{t.sub}</span>}
                    </div>
                  );
                })}
              </div>
            </nav>
            {/* HEADER — name, title, contact row, download button */}
            <div style={{ width:"100%", maxWidth:760, marginBottom:44 }}>
              <h1 style={{ fontFamily:COND, fontWeight:900, fontSize:"clamp(40px,6vw,64px)", color:"#fff", lineHeight:0.95, letterSpacing:"-0.01em", textTransform:"uppercase", margin:0 }}>
                Shavanie Singh
              </h1>
              <div style={{ fontFamily:SANS, fontWeight:300, fontSize:16, color:"rgba(255,255,255,0.8)", marginTop:8 }}>
                UX/Product Designer &amp; Researcher
              </div>
              <div style={{ display:"flex", flexWrap:"wrap", rowGap:6, fontFamily:MONO, fontSize:11, color:"rgba(255,255,255,0.65)", letterSpacing:"0.04em", marginTop:20, alignItems:"center" }}>
                <a href="mailto:shavanie01@gmail.com" style={{ color:"inherit", textDecoration:"none" }}>shavanie01@gmail.com</a>
                <Sep/><span>(929) 742-9476</span>
                <Sep/><span>Flushing, NY</span>
                <Sep/><a href="https://shavanie.com" target="_blank" rel="noopener noreferrer" style={{ color:"rgba(167,139,250,0.85)", textDecoration:"none" }}>Portfolio</a>
                <Sep/><a href="https://github.com/ChandniSingh1" target="_blank" rel="noopener noreferrer" style={{ color:"rgba(167,139,250,0.85)", textDecoration:"none" }}>GitHub</a>
              </div>
              <DownloadResumeButton/>
              <ContactMeButton/>
            </div>

            {/* WORK EXPERIENCE */}
            <ResumeFile file="experience.log">
              {RESUME_EXPERIENCE.map((job, i) => (
                <div key={job.company} style={{ marginBottom: i < RESUME_EXPERIENCE.length - 1 ? 26 : 0, paddingBottom: i < RESUME_EXPERIENCE.length - 1 ? 26 : 0, borderBottom: i < RESUME_EXPERIENCE.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", flexWrap:"wrap", gap:"4px 12px" }}>
                    <span style={{ fontFamily:COND, fontWeight:800, fontSize:19, color:"#fff", letterSpacing:"0.01em" }}>{job.role}</span>
                    <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.6)", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{job.dates}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:"2px 12px", marginTop:3, marginBottom:12 }}>
                    <span style={{ fontFamily:MONO, fontSize:12, color:"rgba(197,180,255,0.95)" }}>{job.company}</span>
                    <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.55)" }}>{job.location}</span>
                  </div>
                  {job.bullets.map((b, bi) => (
                    <div key={bi} style={{ display:"flex", gap:9, marginTop: bi>0 ? 8 : 0 }}>
                      <span style={{ fontFamily:MONO, fontSize:12, color:"rgba(255,255,255,0.35)", flexShrink:0 }}>{"//"}</span>
                      <p style={{ fontFamily:SANS, fontWeight:300, fontSize:13.5, color:"rgba(255,255,255,0.85)", lineHeight:1.6, margin:0 }}>{b}</p>
                    </div>
                  ))}
                </div>
              ))}
            </ResumeFile>

            {/* UX / DESIGN PROJECTS — merges resume-specific details with the same PROJECTS
                array Selected Work uses, so tags/colors/links can never drift out of sync */}
            <ResumeFile file="projects.log">
              {PROJECTS.map((p, i) => {
                const d = RESUME_PROJECT_DETAILS[p.name];
                if (!d) return null;
                return (
                  <div key={p.number} style={{ marginBottom: i < PROJECTS.length - 1 ? 28 : 0, paddingBottom: i < PROJECTS.length - 1 ? 28 : 0, borderBottom: i < PROJECTS.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", flexWrap:"wrap", gap:"4px 12px" }}>
                      <span style={{ fontFamily:COND, fontWeight:800, fontSize:19, color:p.tagText, letterSpacing:"0.01em", textTransform:"uppercase" }}>{p.name}</span>
                      <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.6)", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{d.dates}</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:"2px 12px", marginTop:3, marginBottom:10 }}>
                      <span style={{ fontFamily:MONO, fontSize:11.5, color:"rgba(255,255,255,0.7)" }}>{d.roleLine}</span>
                      <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.55)" }}>{d.location}</span>
                    </div>
                    {d.bullets.map((b, bi) => (
                      <div key={bi} style={{ display:"flex", gap:9, marginTop: bi>0 ? 8 : 0 }}>
                        <span style={{ fontFamily:MONO, fontSize:12, color:"rgba(255,255,255,0.35)", flexShrink:0 }}>{"//"}</span>
                        <p style={{ fontFamily:SANS, fontWeight:300, fontSize:13.5, color:"rgba(255,255,255,0.85)", lineHeight:1.6, margin:0 }}>{b}</p>
                      </div>
                    ))}
                    <div style={{ display:"flex", gap:9, marginTop:8 }}>
                      <span style={{ fontFamily:MONO, fontSize:9.5, letterSpacing:"0.1em", color:p.tagText, flexShrink:0, marginTop:2 }}>KEY_RESULTS</span>
                      <p style={{ fontFamily:SANS, fontWeight:300, fontSize:13.5, color:"rgba(255,255,255,0.85)", lineHeight:1.6, margin:0 }}>{d.keyResults}</p>
                    </div>
                    <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:14 }}>
                      {p.tags.map(t => <ResumeTag key={t} text={t} color={p.tagText}/>)}
                    </div>
                    {p.link && (
                      <a href={p.link} style={{ display:"inline-flex", alignItems:"center", gap:6, marginTop:14, fontFamily:MONO, fontSize:11, letterSpacing:"0.08em", color:p.tagText, textDecoration:"none" }}>
                        {">"} view_case_study {"->"}
                      </a>
                    )}
                  </div>
                );
              })}
            </ResumeFile>

            {/* EDUCATION */}
            <ResumeFile file="education.log">
              {RESUME_EDUCATION.map((ed, i) => (
                <div key={ed.school} style={{ marginBottom: i < RESUME_EDUCATION.length - 1 ? 20 : 0, paddingBottom: i < RESUME_EDUCATION.length - 1 ? 20 : 0, borderBottom: i < RESUME_EDUCATION.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", flexWrap:"wrap", gap:"4px 12px" }}>
                    <span style={{ fontFamily:COND, fontWeight:800, fontSize:19, color:"#fff", letterSpacing:"0.01em" }}>{ed.school}</span>
                    <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.6)", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{ed.dates}</span>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:"2px 12px", marginTop:3 }}>
                    <span style={{ fontFamily:SANS, fontWeight:300, fontSize:13.5, color:"rgba(255,255,255,0.85)" }}>{ed.degree}</span>
                    <span style={{ fontFamily:MONO, fontSize:10, color:"rgba(255,255,255,0.55)" }}>{ed.location}</span>
                  </div>
                  {ed.note && (
                    <p style={{ fontFamily:MONO, fontSize:10.5, fontStyle:"italic", color:"rgba(255,255,255,0.5)", letterSpacing:"0.03em", marginTop:8 }}>{ed.note}</p>
                  )}
                </div>
              ))}
            </ResumeFile>

            {/* CERTIFICATIONS, SKILLS & INTERESTS */}
            <ResumeFile file="skills.json">
              {RESUME_SKILLS.map((g, i) => (
                <div key={g.group} style={{ marginBottom: i < RESUME_SKILLS.length - 1 ? 20 : 0 }}>
                  <div style={{ fontFamily:MONO, fontSize:9.5, letterSpacing:"0.12em", color:"rgba(255,255,255,0.6)", textTransform:"uppercase", marginBottom:10 }}>{g.group}</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {g.items.map(item => <ResumeTag key={item} text={item}/>)}
                  </div>
                </div>
              ))}
            </ResumeFile>
          </section>
        )}
      </div>
    </>
  );
}

// Mount React app into #root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Portfolio />);
</script>
</body>
</html>
