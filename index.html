// HighlightWord — inline span with a colored keyword and glow-on-hover effect
// Used inside highlightDesc() and directly in About section bio paragraphs
// Props: color (rgba string), text, onEnter/onLeave (for cursor state in Portfolio)
function HighlightWord({ color, text, onEnter, onLeave }) {
  const [hov, setHov] = React.useState(false);
  return (
    <span
      onMouseEnter={()=>{ setHov(true); onEnter&&onEnter(); }}
      onMouseLeave={()=>{ setHov(false); onLeave&&onLeave(); }}
      style={{
        color, fontWeight:700,
        textShadow: hov ? "0 0 6px "+color : "none", // glow on hover
        transition:"none",
        cursor:"default",
      }}>{text}</span>
  );
}

// highlightDesc — splits a description string into colored/plain segments
// Iterates over [phrase, color] pairs and splits matching substrings into
// <HighlightWord> spans; non-matching parts stay as plain <span>
// Matching is case-insensitive but preserves original casing in output
function highlightDesc(text, pairs, onEnter, onLeave) {
  let parts = [{ t: text, color: null }]; // start with one unstyled chunk
  for (const [phrase, color] of pairs) {
    parts = parts.flatMap(part => {
      if (part.color !== null) return [part]; // already colored — skip
      const lower = part.t.toLowerCase();
      const idx = lower.indexOf(phrase.toLowerCase());
      if (idx === -1) return [part]; // phrase not found in this chunk
      // split into: before | match | after
      return [
        { t: part.t.slice(0, idx), color: null },
        { t: part.t.slice(idx, idx + phrase.length), color },
        { t: part.t.slice(idx + phrase.length), color: null },
      ].filter(p => p.t); // remove empty strings
    });
  }
  return parts.map((p, i) => p.color
    ? <HighlightWord key={i} color={p.color} text={p.t} onEnter={onEnter} onLeave={onLeave} />
    : <span key={i}>{p.t}</span>
  );
}

// ============================================================
// LOADINGSCREEN
// ============================================================
// Displays a terminal-style boot sequence before the portfolio renders
// Props: onDone — called after all lines print + 1.1s delay
// Fades out via opacity transition when `done` state goes true
function LoadingScreen({ onDone }) {
  const [lines, setLines] = useState([]);  // lines revealed so far
  const [done, setDone]   = useState(false); // triggers fade-out

  useEffect(() => {
    // Stagger each line by 380ms using index offset
    LOADING_LINES.forEach((line, i) => {
      setTimeout(() => {
        setLines(l => [...l, line]); // append one line at a time
        if (i === LOADING_LINES.length - 1) {
          setTimeout(() => setDone(true), 600);  // start fade
          setTimeout(onDone, 1100);              // unmount after fade
        }
      }, i * 380);
    });
  }, []);

  return (
    <div style={{
      position:"fixed", inset:0, zIndex:9999,
      background:DARK,
      display:"flex", alignItems:"center", justifyContent:"center",
      opacity: done ? 0 : 1,         // fade out when done
      transition:"opacity 0.6s ease",
      pointerEvents: done ? "none" : "all", // non-interactive when fading
    }}>
      <div style={{ width:"min(480px,90vw)" }}>
        {/* version label above lines */}
        <div style={{ fontFamily:MONO, fontSize:10, color:"rgba(167,139,250,0.6)", letterSpacing:"0.2em", marginBottom:20 }}>
          PORTFOLIO_OS v2025.1
        </div>

        {/* each line gets a color based on its prefix */}
        {lines.map((line, i) => (
          <div key={i} style={{
            fontFamily:MONO, fontSize:11,
            color: line.startsWith(">>")      ? "rgba(74,222,128,0.9)"    // green for system ready
                 : line.startsWith("type")    ? "rgba(167,139,250,0.8)"   // purple for type definitions
                 : line.startsWith("import")  ? "rgba(30,200,216,0.8)"    // cyan for imports
                 : line.includes("100%")      ? "rgba(240,98,30,0.8)"     // orange for completion
                 : "rgba(255,255,255,0.45)",                               // default dim white
            letterSpacing:"0.04em", lineHeight:1.8,
            animation:"fadeInLine 0.3s ease both", // slides in from left
          }}>{line}</div>
        ))}

        {/* blinking cursor after last line */}
        {lines.length > 0 && (
          <span style={{ display:"inline-block", width:2, height:12, background:"rgba(167,139,250,0.8)", marginTop:4, animation:"cur 0.8s step-end infinite" }} />
        )}
      </div>
    </div>
  );
}

// ============================================================
// SCROLLPROGRESS
// ============================================================
// Thin 3px bar on the right edge of the viewport showing scroll %
// Uses a ref + direct DOM manipulation (no re-renders on scroll)
// Gradient: iridescent orange/pink/cyan at top → steel grey at bottom
function ScrollProgress() {
  const barRef = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      if (!barRef.current) return;
      const el = document.documentElement;
      const pct = (el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100;
      barRef.current.style.height = `${pct}%`; // direct DOM — avoids React re-render
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <div style={{
      position:"fixed", right:4, top:0, bottom:0,
      width:3, zIndex:100, pointerEvents:"none",
      background:"rgba(255,255,255,0.04)", // subtle track
    }}>
      {/* iridescent → steel gradient fills from top based on scroll % */}
      <div ref={barRef} style={{
        width:"100%", height:"0%",
        background:"linear-gradient(to bottom, #f0621a 0%, #e87aa0 12%, #2ab8c4 24%, #1240a0 36%, #8e8e8e 55%, #707070 75%, #8e8e8e 100%)",
        boxShadow:"0 0 6px rgba(240,98,30,0.3)",
      }} />
    </div>
  );
}

// ============================================================
// GLASSCURSOR
// ============================================================
// Custom cursor: outer ring + inner dot — replaces the native cursor (body { cursor:none })
// Props: mouse {x,y}, isHoveringCard, isHoveringCTA, isHoveringTag
// On tag hover: ring enlarges + gains brightness/saturation filter (lens effect)
// On card hover: inner dot turns bright white
function GlassCursor({ mouse, isHoveringCard, isHoveringCTA, isHoveringTag }) {
  return (
    <>
      {/* outer ring — enlarges on tag hover */}
      <div style={{
        position:"fixed",
        left: mouse.x - (isHoveringTag ? 24 : 18), // offset to center
        top:  mouse.y - (isHoveringTag ? 24 : 18),
        width:  isHoveringTag ? 48 : 36,
        height: isHoveringTag ? 48 : 36,
        borderRadius:"50%",
        border: isHoveringTag ? "1px solid rgba(255,255,255,0.5)" : "1px solid rgba(255,255,255,0.25)",
        background: isHoveringTag ? "rgba(255,255,255,0.02)" : "transparent",
        // tag hover: magnifier-like saturation boost instead of blur
        backdropFilter: isHoveringTag ? "brightness(1.3) saturate(1.8) contrast(1.05)" : "blur(2px)",
        WebkitBackdropFilter: isHoveringTag ? "brightness(1.3) saturate(1.8) contrast(1.05)" : "blur(2px)",
        pointerEvents:"none", zIndex:9998,
        transition:"width 0.2s ease, height 0.2s ease, border-color 0.2s, background 0.2s",
      }} />

      {/* inner dot — dims when hovering tag (ring takes visual focus) */}
      <div style={{
        position:"fixed",
        left: mouse.x - 3, top: mouse.y - 3,
        width: 6, height: 6, borderRadius:"50%",
        background: isHoveringTag ? "transparent" : isHoveringCard ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.5)",
        pointerEvents:"none", zIndex:9999,
        transition:"background 0.2s",
      }} />
    </>
  );
}

// ============================================================
// TYPEWRITER
// ============================================================
// Cycles through ROLES array with a type-then-erase animation
// type speed: 175ms/char | erase speed: 70ms/char | pause after full word: 2200ms
// Props: roles (array of strings), isMobile (font size switch)
function Typewriter({ roles, isMobile }) {
  const [text, setText]     = useState("");
  const [ri, setRi]         = useState(0);    // current role index
  const [typing, setTyping] = useState(true); // true = typing, false = erasing
  const [blink, setBlink]   = useState(true); // cursor blink toggle
  useEffect(() => { const id = setInterval(() => setBlink(b=>!b), 530); return ()=>clearInterval(id); }, []);
  useEffect(() => {
    const cur = roles[ri];
    if (typing) {
      if (text.length < cur.length) {
        // still typing — add next character
        const id = setTimeout(()=>setText(cur.slice(0,text.length+1)),175);
        return ()=>clearTimeout(id);
      } else {
        // finished typing — pause before erasing
        const id = setTimeout(()=>setTyping(false),2200);
        return ()=>clearTimeout(id);
      }
    } else {
      if (text.length > 0) {
        // erasing — remove last character
        const id = setTimeout(()=>setText(t=>t.slice(0,-1)),70);
        return ()=>clearTimeout(id);
      } else {
        // fully erased — advance to next role
        setRi(i=>(i+1)%roles.length);
        setTyping(true);
      }
    }
  }, [text, typing, ri]);
  return (
    <span style={{ fontFamily:MONO, color:"#8e8e8e", fontSize:isMobile?"9px":"clamp(12px,1.3vw,15px)", display:"inline-flex", alignItems:"baseline" }}>
      {text}
      {/* blinking underscore cursor */}
      <span style={{ fontFamily:MONO, color:"#8e8e8e", opacity:blink?1:0, transition:"opacity 0.1s", marginLeft:1 }}>_</span>
    </span>
  );
}

// ============================================================
// SCRAMBLETEXT
// ============================================================
// Randomly generates short strings of code-like characters at slow interval
// Used as ambient background noise throughout hero and work sections
// Props: style (position overrides — top/left/right for absolute placement)
const SCRAMBLE_CHARS = "01{}[]()<>=;:./*#@!$%^&_";
function ScrambleText({ style }) {
  const [txt, setTxt] = useState(".......");
  useEffect(() => {
    const id = setInterval(() => {
      const len = 5 + Math.floor(Math.random()*8);
      setTxt(Array.from({length:len},()=>SCRAMBLE_CHARS[Math.floor(Math.random()*SCRAMBLE_CHARS.length)]).join(""));
    }, 900 + Math.random()*700); // randomized interval so multiple instances desync
    return () => clearInterval(id);
  }, []);
  return <div style={{ position:"absolute", fontFamily:"'DM Mono',monospace", fontSize:8, color:"rgba(210,220,235,0.18)", letterSpacing:"0.1em", pointerEvents:"none", userSelect:"none", ...style }}>{txt}</div>;
}

// ============================================================
// VANTEXT
// ============================================================
// SVG-based hover effect on the "VAN" portion of "SHAVANIE" in the hero
// Base state: steel grey stroke outline
// Hover state: iridescent rainbow gradient fills in with a spotlight radial mask
// that follows the cursor horizontally across the letters
//
// Architecture:
//   - Two <text> elements: tRef (grey base) + tOverRef (rainbow overlay)
//   - state.current tracks: cx (gradient center x), targCx (target), op/targOp (opacity)
//   - sizeSvg() — measures text bBox and sizes SVG, gradients, mask to fit
//   - animate() — RAF loop that lerps cx and op, updates SVG attributes directly
//   - onMouseMove — hit-tests cursor against letter bounding box, sets target values
//   - 4 staggered timeouts + document.fonts.ready ensure font loads before measuring
function VanText({ onVanEnter, onVanLeave }) {
  const svgRef    = useRef(null);
  const tRef      = useRef(null); // base grey <text>
  const tOverRef  = useRef(null); // rainbow overlay <text>
  const rafId     = useRef(null);
  const state     = useRef({ cx:0, targCx:0, op:0, targOp:0, w:0, fs:0 }); // mutable RAF state

  useEffect(() => {
    // sizeSvg — measures the actual rendered bBox and sets SVG dimensions + gradient coords
    function sizeSvg() {
      const svg = svgRef.current; if (!svg) return;
      const s = state.current;
      s.fs = window.innerWidth * 0.24; // font size = 24vw (matches hero CSS)
      [tRef.current, tOverRef.current].forEach(el => {
        if (el) { el.setAttribute("font-size", s.fs); el.setAttribute("x","0"); el.setAttribute("y","0"); }
      });
      svg.setAttribute("height","1");
      requestAnimationFrame(() => {
        if (!tRef.current) return;
        try {
          const bb = tRef.current.getBBox(); // actual pixel bounding box of "VAN"
          if (!bb || bb.width < s.fs * 0.5) return; // font not loaded yet — skip
          s.w = Math.ceil(bb.width);
          svg.setAttribute("width", s.w);
          const pull = Math.round(s.fs * 0.03); // negative margin to remove glyph side-bearing
          svg.style.marginLeft  = `-${pull}px`;
          svg.style.marginRight = `-${pull}px`;
          // set rainbow gradient x range
          const lg = svg.querySelector("#vRainbow");
          if (lg) { lg.setAttribute("x1","0"); lg.setAttribute("x2", s.w); }
          // set spotlight radial mask centered on the letter height
          const spotR  = Math.round(s.w * 0.28);
          const spotCY = bb.y + bb.height * 0.5; // vertical center in SVG space (bb.y is negative)
          const rg = svg.querySelector("#vSpotGrad");
          if (rg) { rg.setAttribute("cx", String(s.w * 0.5)); rg.setAttribute("cy", String(spotCY)); rg.setAttribute("r", String(spotR)); }
          const mr = svg.querySelector("#vMaskRect");
          if (mr) { mr.setAttribute("x", String(-spotR)); mr.setAttribute("y", String(bb.y - 10)); mr.setAttribute("width", String(s.w + spotR*2)); mr.setAttribute("height", String(bb.height + 20)); }
          s.spotCY = spotCY;
          s.spotR  = spotR;
        } catch(e) {}
      });
    }

    // animate — RAF loop for smooth lerp on gradient position + opacity
    function animate() {
      const s = state.current;
      s.cx += (s.targCx - s.cx) * 0.13;    // lerp gradient center toward cursor
      const rate = s.targOp > s.op ? 0.22 : 0.04; // fast fade in, slow fade out
      s.op += (s.targOp - s.op) * rate;

      if (tOverRef.current) tOverRef.current.setAttribute("opacity", s.op.toFixed(3)); // rainbow fades in
      if (tRef.current) tRef.current.setAttribute("opacity", (1 - s.op * 0.85).toFixed(3)); // grey fades out

      // move rainbow gradient center horizontally with cursor
      const svg = svgRef.current;
      if (svg && s.w > 0) {
        const lg = svg.querySelector("#vRainbow");
        if (lg) {
          const half = s.w * 0.7;
          lg.setAttribute("x1", (s.cx - half).toFixed(1));
          lg.setAttribute("x2", (s.cx + half).toFixed(1));
        }
        // move spotlight mask center to cursor x position
        const rg = svg.querySelector("#vSpotGrad");
        if (rg) {
          const pct = s.w > 0 ? (s.cx / s.w * 100).toFixed(1) : "50";
          rg.setAttribute("cx", pct + "%");
        }
      }
      rafId.current = requestAnimationFrame(animate);
    }

    // onMouseMove — hit-tests cursor against the letter zone and sets targets
    function onMouseMove(e) {
      const s = state.current; if (s.w < 10) return;
      const svg = svgRef.current; if (!svg) return;
      const sr  = svg.getBoundingClientRect();
      const fs  = window.innerWidth * 0.24;
      const pad = fs * 0.4;
      // letter zone extends above SVG top edge (letters hang above the SVG baseline)
      const top    = sr.top - fs * 0.78; // fs*0.78 = approx ascender height
      const bottom = sr.top + fs * 0.05;
      const hit = e.clientX >= sr.left && e.clientX <= sr.right &&
                  e.clientY >= top && e.clientY <= bottom;
      const wasHit = s.targOp === 1;
      s.targOp = hit ? 1 : 0;
      if (hit) s.targCx = ((e.clientX - sr.left) / sr.width) * s.w; // cursor x in SVG space
      if (hit && !wasHit) onVanEnter && onVanEnter();   // cursor entered — enlarge glass cursor
      if (!hit && wasHit) onVanLeave && onVanLeave();   // cursor left
    }

    // Staggered timeouts ensure font has loaded before measuring (race condition safety)
    const t1=setTimeout(sizeSvg,300),t2=setTimeout(sizeSvg,900),t3=setTimeout(sizeSvg,2000),t4=setTimeout(sizeSvg,3200);
    document.fonts.ready.then(sizeSvg);
    if(document.fonts?.load) document.fonts.load("900 100px 'Barlow Condensed'").then(sizeSvg).catch(()=>{});

    // Touch support — treats first touch point as mouse position
    function onTouch(e) { if(e.touches?.length>0){ const t=e.touches[0]; onMouseMove({clientX:t.clientX,clientY:t.clientY}); } }
    function onTouchEnd() { state.current.targOp = 0; onVanLeave && onVanLeave(); }

    window.addEventListener("resize", sizeSvg);
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("touchmove", onTouch, {passive:true});
    window.addEventListener("touchstart", onTouch, {passive:true});
    window.addEventListener("touchend", onTouchEnd, {passive:true});
    rafId.current = requestAnimationFrame(animate);
    return () => {
      clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4);
      window.removeEventListener("resize", sizeSvg);
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("touchmove", onTouch);
      window.removeEventListener("touchstart", onTouch);
      window.removeEventListener("touchend", onTouchEnd);
      if (rafId.current) cancelAnimationFrame(rafId.current);
    };
  }, []);

  return (
    <svg ref={svgRef} width="0" height="1"
      style={{display:"inline-block", verticalAlign:"baseline", overflow:"visible"}}
      overflow="visible">
      <defs>
        {/* spotlight radial — a soft white circle that masks the rainbow, follows cursor */}
        <radialGradient id="vSpotGrad" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stopColor="white" stopOpacity="1"/>
          <stop offset="35%"  stopColor="white" stopOpacity="0.6"/>
          <stop offset="70%"  stopColor="white" stopOpacity="0.15"/>
          <stop offset="100%" stopColor="white" stopOpacity="0"/>
        </radialGradient>
        <mask id="vSpotMask">
          <rect id="vMaskRect" x="0" y="0" width="100" height="100" fill="url(#vSpotGrad)"/>
        </mask>
        {/* rainbow gradient — x1/x2 shift to follow cursor, creating a moving shimmer */}
        <linearGradient id="vRainbow" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stopColor="#1240a0"/>
          <stop offset="12%"  stopColor="#e87aa0"/>
          <stop offset="22%"  stopColor="#2ab8c4"/>
          <stop offset="32%"  stopColor="#e87aa0"/>
          <stop offset="40%"  stopColor="#f0621a"/>
          <stop offset="48%"  stopColor="#c8eeff" stopOpacity="0.95"/>
          <stop offset="56%"  stopColor="#f0621a"/>
          <stop offset="65%"  stopColor="#e87aa0"/>
          <stop offset="76%"  stopColor="#7b6fd4"/>
          <stop offset="86%"  stopColor="#e87aa0"/>
          <stop offset="94%"  stopColor="#2ab8c4"/>
          <stop offset="100%" stopColor="#1240a0"/>
        </linearGradient>
      </defs>

      {/* base layer — steel grey stroke outline, fades out on hover */}
      <text ref={tRef} fill="none" stroke="#8e8e8e" strokeWidth="3.5"
        fontFamily="'Barlow Condensed',sans-serif" fontWeight="900"
        dominantBaseline="auto" textAnchor="start">VAN</text>

      {/* rainbow overlay — fades in on hover, masked to spotlight radius */}
      <text ref={tOverRef} opacity="0"
        fill="none" stroke="url(#vRainbow)" strokeWidth="4.5"
        mask="url(#vSpotMask)"
        fontFamily="'Barlow Condensed',sans-serif" fontWeight="900"
        dominantBaseline="auto" textAnchor="start">VAN</text>
    </svg>
  );
}

        {/* Giant name — SHA + VAN (interactive SVG) + IE */}
        <div style={{
          ...rev(0.2), // staggered entry animation
          fontFamily:COND, fontWeight:900, fontSize:"24vw",
          lineHeight:0.87, textTransform:"uppercase",
          whiteSpace:"nowrap", width:"100%",
          display:"flex", alignItems:"baseline", justifyContent:"center", gap:0,
          userSelect:"none",
        }}>
          <span style={{ color:"#fff" }}>SHA</span>
          {/* VanText handles its own SVG sizing/animation — onVanEnter/Leave update cursor */}

// ============================================================
// Pill tag for the About page feed — builds project-style object from
// color + border props so it can reuse HoverTag's rendering logic
// NOTE: This is functionally near-identical to HoverTag; could be merged
function AboutTag({ t, color, border, onTagEnter, onTagLeave }) {
  const [hov, setHov] = React.useState(false);
  const idx = border.lastIndexOf(",");
  // derive tagColor (low-opacity background) from tagBorder by replacing last value with "0.18)"
  const tagColor = border.slice(0,idx+1)+"0.18)";
  const project = { tagText: color, tagBorder: border, tagColor };
  const tag = t;
  return (
    <span
      onMouseEnter={()=>{ setHov(true); onTagEnter&&onTagEnter(); }}
      onMouseLeave={()=>{ setHov(false); onTagLeave&&onTagLeave(); }}
      style={{
        fontFamily:MONO, fontSize:9.5, letterSpacing:"0.1em", textTransform:"uppercase",
        color: hov ? "#fff" : project.tagText,
        background: hov ? project.tagBorder : project.tagColor,
        padding:"5px 12px", borderRadius:20,
        border:"1px solid "+(hov ? project.tagText : project.tagBorder),
        boxShadow: hov ? "0 0 12px "+project.tagBorder : "none",
        cursor:"default",
      }}>"<span style={{ margin:"0 1px" }}>{tag}</span>"</span>
  );
}

// Renders the 4 project Cards stacked vertically with GAP_CODE between them
// Manages hoveredIndex state and passes hover handlers down to each Card
// WORK_FRAGS + ScrambleText instances provide background texture (hidden on mobile)
function SelectedWork({ onCardHover, onCardEnter, onCardLeave, onCTAEnter, onCTALeave, onTagEnter, onTagLeave, isMobile }) {
  const [hoveredIndex, setHoveredIndex] = useState(null);
  const handle = (i) => { setHoveredIndex(i); onCardHover && onCardHover(i); };

  // fragRefs — one ref per WORK_FRAG, used for proximity-based opacity
  const fragRefs = useRef([]);
  const sectionRef = useRef(null);

  useEffect(() => {
    function fadeFrags() {
      if (!sectionRef.current) return;
      const sectionRect = sectionRef.current.getBoundingClientRect();
      const sectionW = sectionRect.width;
      // card stack is maxWidth 1400px centered — calculate its left/right edges
      const cardW = Math.min(sectionW, 1400);
      const cardLeft  = (sectionW - cardW) / 2;  // px from section left edge
      const cardRight = cardLeft + cardW;         // px from section left edge
      const fadeZone  = 60; // px — how far outside the border fading starts

      fragRefs.current.forEach((el, i) => {
        if (!el) return;
        const baseOpacity = parseFloat(el.dataset.baseOpacity || 0.15);
        const r = el.getBoundingClientRect();
        // convert frag position to section-relative x
        const fragLeft  = r.left - sectionRect.left;
        const fragRight = r.right - sectionRect.left;
        const fragCenter = (fragLeft + fragRight) / 2;

        // distance from frag center to nearest card edge (negative = inside card)
        const distToLeft  = fragCenter - cardLeft;
        const distToRight = cardRight - fragCenter;
        const minDist = Math.min(distToLeft, distToRight);

        if (minDist <= 0) {
          el.style.opacity = 0; // inside card — fully hidden
        } else if (minDist < fadeZone) {
          el.style.opacity = baseOpacity * (minDist / fadeZone); // fade zone
        } else {
          el.style.opacity = baseOpacity; // safe zone — full opacity
        }
      });
    }

    fadeFrags();
    window.addEventListener("resize", fadeFrags);
    return () => window.removeEventListener("resize", fadeFrags);
  }, []);
  return (
    <section ref={sectionRef} id="work" style={{ padding:isMobile?"48px 16px 80px":"80px 48px 120px", overflow:"visible", position:"relative" }}>
      {/* background frags — absolute, full section, no pointer events, hidden mobile */}
      {/* each frag fades individually based on proximity to the card border via JS resize observer */}
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", overflow:"visible", zIndex:0, display:isMobile?"none":"block" }}>
        {WORK_FRAGS.map((f,i) => (
          <div key={i}
            ref={el => fragRefs.current[i] = el}
            data-base-opacity={f.opacity}
            style={{ position:"absolute", fontFamily:MONO, fontSize:9, letterSpacing:"0.04em", color:"rgba(210,220,235,1)", whiteSpace:"nowrap", top:f.top, left:f.left||undefined, right:f.right||undefined, opacity:f.opacity, pointerEvents:"none", transition:"opacity 0.3s ease" }}>{f.text}</div>
        ))}
        <ScrambleText style={{ top:"18%", left:"10%" }} />
        <ScrambleText style={{ top:"42%", right:"11%" }} />
        <ScrambleText style={{ top:"63%", left:"13%" }} />
        <ScrambleText style={{ top:"88%", right:"9%" }} />
      </div>

      {/* section header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:52, paddingBottom:16, borderBottom:"1px solid rgba(255,255,255,0.07)" }}>
        <span style={{ fontFamily:MONO, fontSize:9, letterSpacing:"0.22em", textTransform:"uppercase", color:"rgba(255,255,255,0.55)" }}>Selected Work</span>
        <span style={{ fontFamily:MONO, fontSize:9, color:"rgba(255,255,255,0.4)", letterSpacing:"0.1em" }}>004 projects</span>
      </div>

      {/* card stack — capped at 1400px and centered; header above stays full-bleed */}
      <div style={{ display:"flex", flexDirection:"column", gap:0, width:"100%", maxWidth:1400, margin:"0 auto" }}>
        {PROJECTS.map((p,i) => (
          <div key={p.number}>
            <Card project={p} index={i} hoveredIndex={hoveredIndex} onHover={handle} onMouseEnterCard={onCardEnter} onMouseLeaveCard={onCardLeave} onCTAEnter={onCTAEnter} onCTALeave={onCTALeave} onTagEnter={onTagEnter} onTagLeave={onTagLeave} isMobile={isMobile} />
            {/* faint code snippet in the gap between cards */}
            {i < PROJECTS.length - 1 && (
              <div style={{ padding:"12px 4px", display:"flex", justifyContent:"center" }}>
                <span style={{ fontFamily:MONO, fontSize:8, color:"rgba(255,255,255,0.08)", letterSpacing:"0.06em", fontStyle:"italic" }}>{GAP_CODE[i]}</span>
              </div>
            )}
          </div>
        ))}
      </div>
    </section>
  );
}

// Colorful radial blobs that appear where the user clicks on the canvas
// (clicking on buttons/links is excluded in Portfolio.handleClick)
// Lifecycle: fade in (50ms delay) → hold → fade out (2000ms) → unmount (2800ms)
function ClickBlob({ x, y, color, id, onRemove }) {
  const [opacity, setOpacity] = useState(0);
  useEffect(() => {
    setTimeout(() => setOpacity(0.7), 50);         // fade in
    setTimeout(() => setOpacity(0), 2000);          // begin fade out
    setTimeout(() => onRemove(id), 2800);           // remove from state after fade
  }, []);
  return (
    <div style={{
      position:"fixed", left:x-60, top:y-60,
      width:120, height:120, borderRadius:"50%",
      background:"radial-gradient(circle, "+color+" 0%, transparent 70%)",
      filter:"blur(25px)", opacity,
      transition:"opacity 1.8s ease",
      pointerEvents:"none", zIndex:50,
    }} />
  );
}

// ============================================================
// PORTFOLIO — root component
// ============================================================
// Top-level state manager and page router
//
// State managed here:
//   currentPage      — "work" | "about" | "resume" (page router)
//   mouse / mouseRef — cursor position; ref for RAF, state for GlassCursor render
//   loaded           — true after loading screen completes (enables entry animations)
//   showLoading      — true until LoadingScreen fade is done
//   hoveredCard / hoveredCardRef — index of hovered project card (ref for RAF, state for re-render)
//   isHoveringCard/CTA/Tag — cursor state flags for GlassCursor shape changes
//   clickBlobs       — array of {x,y,color,id} for ClickBlob splashes
//
// Refs (direct DOM manipulation, no re-renders):
//   bgBlob0–3        — 4 ambient background gradient blobs
//   bgBlobMouse      — mouse-reactive white highlight blob
//   winSizeRef       — current window dimensions for RAF calculations
//
// Key effects:
//   RAF loop         — updates bg blob positions from mouseRef + hoveredCardRef
//                      using repulse() (blobs flee cursor) + melt() (blobs shift on card hover)
//   onMouseMove      — updates mouseRef (no re-render) + mouse state (GlassCursor only)
//   handleClick      — adds ClickBlob at click position (excluding interactive elements)
function Portfolio() {
  const [currentPage, setCurrentPage] = React.useState("work");

  // mouseRef — updated every frame for RAF, no re-render
  // mouse (state) — only for GlassCursor which needs React to reposition
  const mouseRef = useRef({ x: 0, y: 0 });
  const [mouse, setMouse] = useState({ x:0, y:0 });

  const [loaded, setLoaded]           = useState(false);
  const [showLoading, setShowLoading]  = useState(true);
  const [hoveredCard, setHoveredCard]  = useState(null);
  const hoveredCardRef = useRef(null); // ref version for RAF loop (no re-render)
  const [isHoveringCard, setIsHoveringCard] = useState(false);
  const [isHoveringCTA,  setIsHoveringCTA]  = useState(false);
  const [isHoveringTag,  setIsHoveringTag]  = useState(false);
  const [clickBlobs, setClickBlobs]    = useState([]);

  // 4 ambient background blobs + 1 mouse-tracking blob (refs = no re-render on move)
  const bgBlob0 = useRef(null); const bgBlob1 = useRef(null);
  const bgBlob2 = useRef(null); const bgBlob3 = useRef(null);
  const bgBlobMouse = useRef(null);

  const winSizeRef = useRef({ w: window.innerWidth, h: window.innerHeight });
  const [winSize, setWinSize] = useState({ w: window.innerWidth, h: window.innerHeight });
  const isMobile = (typeof window !== 'undefined') && (window.screen.width < 768 || window.innerWidth < 768);

  // window resize handler — updates both ref (for RAF) and state (for mx/my calc)
  useEffect(() => {
    const update = () => {
      winSizeRef.current = { w: window.innerWidth, h: window.innerHeight };
      setWinSize({ w: window.innerWidth, h: window.innerHeight });
    };
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, []);

  // ============================================================
  // BACKGROUND BLOB RAF LOOP
  // Updates bg blob positions directly via refs (zero React re-renders)
  //
  // Two forces act on each blob:
  //   repulse() — blobs float away from cursor (soft spring)
  //   melts     — blobs shift toward corners when a card is hovered
  //               (index maps card 0–3 to quadrant offset presets)
  // ============================================================
  useEffect(() => {
    // melt presets: blob offsets (%) when a specific card is hovered
    // index matches hoveredCardRef — blobs "melt" in different directions per card
    const melts = { 0:{x:-25,y:-20}, 1:{x:25,y:-20}, 2:{x:-25,y:20}, 3:{x:25,y:20} };

    // base center positions of each blob (% of viewport)
    const blobBases = [
      { cx:27.5, cy:17.5 }, // blob 0: top-left
      { cx:70, cy:72.5 },   // blob 1: bottom-right
      { cx:50,   cy:35   }, // blob 2: center-top
      { cx:23, cy:66   },   // blob 3: left-mid
    ];

    // repulse — returns (x,y) offset pushing blob away from cursor
    // strength falls off with distance (cubic falloff, max range = 55% of min viewport dim)
    function repulse(base, mx, my, w, h) {
      const bx = (base.cx/100)*w; const by = (base.cy/100)*h;
      const dx = bx-mx; const dy = by-my;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const maxD = Math.min(w,h)*0.55;
      if (dist>maxD||dist===0) return {x:0,y:0}; // out of range
      const str = 12*Math.pow(1-dist/maxD,1.5); // max 12% push at center
      return {x:(dx/dist)*str, y:(dy/dist)*str};
    }

    let rafId;
    function frame() {
      const { x: mx, y: my } = mouseRef.current;
      const { w, h } = winSizeRef.current;
      const hc = hoveredCardRef.current; // null or 0–3
      const m = hc !== null ? melts[hc] : {x:0,y:0}; // melt offset for hovered card
      const reps = blobBases.map(b => repulse(b, mx, my, w, h));
      // update each blob's left/top — base position + melt offset + repulse offset
      if (bgBlob0.current) { bgBlob0.current.style.left=`calc(-5% + ${m.x*0.8+reps[0].x}%)`; bgBlob0.current.style.top=`calc(-10% + ${m.y*0.8+reps[0].y}%)`; }
      if (bgBlob1.current) { bgBlob1.current.style.left=`calc(40% + ${m.x*0.6+reps[1].x}%)`; bgBlob1.current.style.top=`calc(45% + ${m.y*0.6+reps[1].y}%)`; }
      if (bgBlob2.current) { bgBlob2.current.style.left=`calc(30% + ${m.x*1.2+reps[2].x}%)`; bgBlob2.current.style.top=`calc(15% + ${m.y*1.2+reps[2].y}%)`; }
      if (bgBlob3.current) { bgBlob3.current.style.left=`calc(5% + ${m.x*1.0+reps[3].x}%)`; bgBlob3.current.style.top=`calc(48% + ${m.y*1.0+reps[3].y}%)`; }
      // mouse blob tracks cursor directly with a CSS transition for smoothing
      if (bgBlobMouse.current) { bgBlobMouse.current.style.left=`calc(${w>0?(mx/w)*100:50}% - 15%)`; bgBlobMouse.current.style.top=`calc(${h>0?(my/h)*100:50}% - 15%)`; }
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(rafId);
  }, []);

  // onMouseMove — updates ref immediately (for RAF), sets state only for GlassCursor
  const onMouseMove = useCallback((e) => {
    mouseRef.current = { x: e.clientX, y: e.clientY };
    setMouse({ x: e.clientX, y: e.clientY }); // triggers GlassCursor re-render only
  }, []);

  // handleSetHoveredCard — keeps ref + state in sync for card hover
  const handleSetHoveredCard = useCallback((val) => {
    hoveredCardRef.current = val; // sync ref for RAF loop (no re-render)
    setHoveredCard(val);          // sync state for any future reactive uses
  }, []);

  // handleClick — spawns ClickBlob at cursor position on canvas clicks
  // Skips interactive elements (buttons, links, data-interactive)
  const handleClick = useCallback((e) => {
    if (e.target.closest("button,a,[data-interactive]")) return;
    const color = CLICK_COLORS[Math.floor(Math.random() * CLICK_COLORS.length)];
    const id = Date.now() + Math.random(); // unique id for blob removal
    setClickBlobs(b => [...b, { x: e.clientX, y: e.clientY, color, id }]);
  }, []);

  // removeBlob — called by ClickBlob after its fade-out is complete
  const removeBlob = useCallback((id) => {
    setClickBlobs(b => b.filter(bl => bl.id !== id));
  }, []);

  // normalized mouse position (-0.5 to 0.5) for hero parallax (px, py props)
  const mx = winSize.w > 0 ? mouse.x / winSize.w - 0.5 : 0;
  const my = winSize.h > 0 ? mouse.y / winSize.h - 0.5 : 0;

  return (
    <>
      {/* ============================================================
          GLOBAL STYLES
          - Font imports: Satoshi (sans), Barlow Condensed (display), DM Mono (mono)
          - Reset: box-sizing, scroll-behavior, hidden scrollbar, cursor:none
          - .nav-tab / .nav-sub — hover-reveal sub-label via CSS (not JS)
          - @keyframes: cur (blink), pulse, fadeInLine, drift1–4 (blob CSS anim), iridescentShift
          - .portfolio-card ::after (silver border) / ::before (iridescent border)
            → card-hovered class fades both out (iridescent border handled by JS class toggle)
          ============================================================ */}
      <style>{`
        @import url('https://fonts.cdnfonts.com/css/satoshi');
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap');
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none; }
        html::-webkit-scrollbar { display:none; }
        body { background:#08080c; cursor:none; } /* native cursor hidden — GlassCursor used instead */
        /* nav sub-label: max-height 0 by default, expands to 20px on parent hover */
        .nav-sub { max-height:0 !important; opacity:0 !important; transition: max-height 0.2s ease, opacity 0.2s ease; }
        .nav-tab:hover .nav-sub { max-height:20px !important; opacity:1 !important; }
        @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }           /* blinking cursor */
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
        @keyframes fadeInLine { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} } /* loading screen lines */
        /* CSS drift animations for ambient bg blobs (separate from JS RAF repulse) */
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(9%,7%) scale(1.12)} 66%{transform:translate(-7%,10%) scale(0.9)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 40%{transform:translate(-10%,-7%) scale(1.1)} 70%{transform:translate(7%,-9%) scale(0.92)} }
        @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 30%{transform:translate(8%,-9%) scale(1.14)} 65%{transform:translate(-9%,7%) scale(0.88)} }
        @keyframes drift4 { 0%,100%{transform:translate(0,0) scale(1)} 45%{transform:translate(-8%,9%) scale(1.11)} 75%{transform:translate(10%,-6%) scale(0.91)} }
        @keyframes iridescentShift { 0%{background-position: 0% 0%;} 100%{background-position: 200% 200%;} } /* card border shimmer */

        .portfolio-card { position: relative; }

        /* silver gradient border — default state (::after is lower z-index, always shows) */
        .portfolio-card::after {
          content: ''; position: absolute; inset: 0; border-radius: 0; padding: 1.5px;
          background: linear-gradient(135deg, #b8b8b8 0%, #8e8e8e 30%, #606060 55%, #8e8e8e 75%, #b8b8b8 100%);
          /* mask trick: show only the 1.5px padding ring (excludes content box) */
          -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          mask-composite: exclude; pointer-events: none; z-index: 4; opacity: 0.5; transition: opacity 0.4s ease;
        }

        /* iridescent animated border — fades in on hover (::before, higher z-index) */
        .portfolio-card::before {
          content: ''; position: absolute; inset: 0; border-radius: 0; padding: 1.5px;
          background: linear-gradient(135deg, #f0621a 0%, #e87aa0 25%, #2ab8c4 50%, #1240a0 75%, #f0621a 100%);
          background-size: 200% 200%; animation: iridescentShift 3s linear infinite;
          -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          mask-composite: exclude; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.4s ease;
        }

        /* card-hovered: both borders hidden (blob bg + content takes over visually) */
        .portfolio-card.card-hovered::after  { opacity: 0; }
        .portfolio-card.card-hovered::before { opacity: 0; }
      `}</style>

      {/* Loading screen — shown until loaded=true; fades out and unmounts */}
      {showLoading && <LoadingScreen onDone={() => { setLoaded(true); setTimeout(() => setShowLoading(false), 700); }} />}

      {/* Glass cursor — follows mouse state (re-renders on every mouse move intentionally) */}
      <GlassCursor mouse={mouse} isHoveringCard={isHoveringCard} isHoveringCTA={isHoveringCTA} isHoveringTag={isHoveringTag} />

      {/* Scroll progress bar — right edge, 3px, iridescent gradient */}
      <ScrollProgress />

      {/* Click blobs — rendered at top level so they aren't clipped by section overflow */}
      {clickBlobs.map(b => <ClickBlob key={b.id} {...b} onRemove={removeBlob} />)}

      {/* FIXED BACKGROUND LAYER — 4 color blobs + mouse blob + grain texture */}
      {/* blob positions are driven entirely by the RAF loop via refs (no re-renders) */}
      <div style={{ position:"fixed", inset:0, zIndex:0, pointerEvents:"none", background:DARK }}>
        {/* blob 0: orange — top-left */}
        <div ref={bgBlob0} style={{ position:"absolute", borderRadius:"50%", filter:"blur(70px)", background:"radial-gradient(circle, #f0621a 0%, #d13a0a 50%, transparent 100%)", width:"65%", height:"55%", left:"-5%", top:"-10%", animation:"drift1 8s ease-in-out infinite", transition:"left 0.25s ease, top 0.25s ease", opacity:0.7 }} />
        {/* blob 1: blue — bottom-right */}
        <div ref={bgBlob1} style={{ position:"absolute", borderRadius:"50%", filter:"blur(75px)", background:"radial-gradient(circle, #1240a0 0%, #0a2878 50%, transparent 100%)", width:"60%", height:"55%", left:"40%", top:"45%", animation:"drift2 11s ease-in-out infinite", transition:"left 0.25s ease, top 0.25s ease", opacity:0.65 }} />
        {/* blob 2: cyan — center */}
        <div ref={bgBlob2} style={{ position:"absolute", borderRadius:"50%", filter:"blur(65px)", background:"radial-gradient(circle, #2ab8c4 0%, #0aaabb 50%, transparent 100%)", width:"40%", height:"40%", left:"30%", top:"15%", animation:"drift3 7s ease-in-out infinite", transition:"left 0.25s ease, top 0.25s ease", opacity:0.6 }} />
        {/* blob 3: pink — left-mid */}
        <div ref={bgBlob3} style={{ position:"absolute", borderRadius:"50%", filter:"blur(65px)", background:"radial-gradient(circle, #e87aa0 0%, #d45a84 50%, transparent 100%)", width:"36%", height:"36%", left:"5%", top:"48%", animation:"drift4 9s ease-in-out infinite", transition:"left 0.25s ease, top 0.25s ease", opacity:0.6 }} />
        {/* mouse-reactive soft white highlight — faster CSS transition for responsiveness */}
        <div ref={bgBlobMouse} style={{ position:"absolute", borderRadius:"50%", filter:"blur(80px)", background:"radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%)", width:"30%", height:"30%", left:"35%", top:"35%", transition:"left 0.1s linear, top 0.1s linear", opacity:0.5, pointerEvents:"none" }} />
        {/* SVG grain texture overlay — fractal noise, overlay blend mode */}
        <div style={{ position:"absolute", inset:0, opacity:0.6, backgroundImage:"url(\"data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.45'/%3E%3C/svg%3E\")", backgroundSize:"210px", mixBlendMode:"overlay" }} />
      </div>

      {/* MAIN CONTENT — z-index 1, above fixed bg layer */}
      {/* onMouseMove + onClick handled here so they cover the full page */}
      <div
        style={{ position:"relative", zIndex:1 }}
        onMouseMove={onMouseMove}
        onClick={handleClick}
      >
        {/* WORK PAGE */}
        {currentPage === "work" && <>
          <Hero
            px={mx*30} py={my*30}        // parallax: 30px max offset from center
            loaded={loaded}
            currentPage={currentPage} setCurrentPage={setCurrentPage}
            isMobile={isMobile}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
          />
          <SelectedWork
            isMobile={isMobile}
            onCardHover={handleSetHoveredCard}  // index or null
            onCardEnter={() => setIsHoveringCard(true)}
            onCardLeave={() => setIsHoveringCard(false)}
            onCTAEnter={() => setIsHoveringCTA(true)}
            onCTALeave={() => setIsHoveringCTA(false)}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
          />
          <Footer />
        </>}

        {/* ABOUT PAGE */}
        {currentPage === "about" && (
          <AboutFeed
            currentPage={currentPage} setCurrentPage={setCurrentPage}
            onTagEnter={() => setIsHoveringTag(true)}
            onTagLeave={() => setIsHoveringTag(false)}
            isMobile={isMobile}
          />
        )}

        {/* RESUME PAGE — placeholder until PDF is ready */}
        {currentPage === "resume" && (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"60vh", fontFamily:"'DM Mono',monospace", fontSize:13, color:"rgba(255,255,255,0.3)", letterSpacing:"0.1em" }}>
            resume.pdf - coming soon
          </div>
        )}
      </div>
    </>
  );
}

// Mount React app into #root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Portfolio />);
